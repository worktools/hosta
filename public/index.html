<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hosta · AI 软件工厂</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><div><p class="eyebrow">HOSTA / LOCAL MVP</p><h1>把一句需求变成可调用服务</h1><p class="subtitle">生成、编辑、诊断 JavaScript，再发布 Webhook 或定时运行。</p></div><span id="generator" class="badge">检查中</span></header><section class="panel"><h2>创建自动化</h2><form id="create-form"><label>名称<input name="name" required placeholder="订单金额汇总"></label><label>描述<textarea name="description" required placeholder="输入 items 数组，汇总 amount 并返回 total。"></textarea></label><label>示例 JSON 输入<textarea name="sample" required>{"items":[{"amount":12},{"amount":8}]}</textarea></label><button>创建并生成版本</button></form><p id="form-error" class="error"></p></section><section><div class="section-title"><h2>应用</h2><button id="refresh" class="secondary">刷新</button></div><div id="apps" class="apps"><p class="muted">还没有应用。创建第一个自动化吧。</p></div></section></main><template id="app-template"><article class="panel app"><div class="app-head"><div><p class="eyebrow app-id"></p><h2 class="app-name"></h2><p class="app-desc"></p></div><span class="status"></span></div><div class="version"></div><p class="runs"></p><details><summary>编辑、运行、发布与定时触发</summary><label>程序代码<textarea class="code-editor" spellcheck="false"></textarea></label><div class="actions"><button class="save secondary">保存为新版本</button><button class="diagnose secondary">诊断当前版本</button></div><pre class="diagnostics"></pre><label>试运行 JSON<textarea class="run-input"></textarea></label><div class="actions"><button class="run">试运行</button><button class="publish secondary">发布 Webhook</button></div><pre class="output"></pre><div class="deployment"></div><div class="schedule-box"><h3>定时触发</h3><label>间隔（秒，至少 60）<input class="schedule-interval" type="number" min="60" max="86400" value="300"></label><button class="schedule secondary">创建定时任务</button><div class="schedule-list"></div></div></details></article></template><script type="module" src="/app.js"></script></body></html>
